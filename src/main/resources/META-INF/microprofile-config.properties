# Define your configuration properties here
defaultName=Hello, World!

# Keycloak OIDC Configuration
keycloak.realm=jdd-poland
keycloak.auth-server-url=http://localhost:8180
keycloak.client-id=jdd-healthcare-app
keycloak.client-secret=jdd-healthcare-secret-2024

# Service Client Configuration
service.client-id=service-client
service.client-secret=service-client-secret-2024

# Security Settings
security.session.timeout=1800
security.token.refresh.threshold=60
security.mfa.enabled=true
security.audit.enabled=true

# MicroProfile JWT Configuration
# See https://github.com/eclipse/microprofile-jwt-auth
mp.jwt.verify.publickey.location=http://keycloak:8180/realms/${keycloak.realm}/protocol/openid-connect/certs
mp.jwt.verify.issuer=http://localhost:8180/realms/${keycloak.realm}
mp.jwt.verify.audiences=${keycloak.client-id}

# Database Configuration
db.host=localhost
db.port=5432
db.name=keycloak
db.user=keycloak
db.password=keycloak